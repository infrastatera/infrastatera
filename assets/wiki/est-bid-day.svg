<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="t d">
  <title id="t">Bid day</title>
  <desc id="d">Before bid day everything is priced with plugs and forms are ready; on bid day quotes arrive, are leveled and chosen, listing and DBE are finished, the bid is checked and submitted with margin before the deadline.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="260" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Bid day</text>
    <path d="M40 96 H760" stroke="#D5D9DE" stroke-width="4"/>
  <circle cx="100" cy="96" r="9" fill="#595959"/>
  <text class="l" x="100" y="130" text-anchor="middle" style="fill:#595959">Day before</text>
  <text class="s" x="100" y="150" text-anchor="middle">priced with</text>
  <text class="s" x="100" y="165" text-anchor="middle">plugs, forms</text>
  <text class="s" x="100" y="180" text-anchor="middle">ready</text>
  <circle cx="220" cy="96" r="9" fill="#0070D5"/>
  <text class="l" x="220" y="130" text-anchor="middle">Morning</text>
  <text class="s" x="220" y="150" text-anchor="middle">last quotes</text>
  <text class="s" x="220" y="165" text-anchor="middle">arrive</text>
  <circle cx="340" cy="96" r="9" fill="#B26A00"/>
  <text class="l" x="340" y="130" text-anchor="middle" style="fill:#B26A00">Level</text>
  <text class="s" x="340" y="150" text-anchor="middle">scope,</text>
  <text class="s" x="340" y="165" text-anchor="middle">exclusions</text>
  <circle cx="460" cy="96" r="9" fill="#B26A00"/>
  <text class="l" x="460" y="130" text-anchor="middle" style="fill:#B26A00">Forms</text>
  <text class="s" x="460" y="150" text-anchor="middle">sub listing, DBE</text>
  <circle cx="580" cy="96" r="9" fill="#C92A06"/>
  <text class="l" x="580" y="130" text-anchor="middle" style="fill:#C92A06">Check</text>
  <text class="s" x="580" y="150" text-anchor="middle">totals, markups,</text>
  <text class="s" x="580" y="165" text-anchor="middle">big items</text>
  <circle cx="700" cy="96" r="9" fill="#2E7D32"/>
  <text class="l" x="700" y="130" text-anchor="middle" style="fill:#2E7D32">Submit</text>
  <text class="s" x="700" y="150" text-anchor="middle">with margin</text>
  <text class="s" x="700" y="165" text-anchor="middle">before the</text>
  <text class="s" x="700" y="180" text-anchor="middle">deadline</text>
  <text class="s" x="32" y="242">Set a quote cut-off well before the deadline.</text>
</svg>
