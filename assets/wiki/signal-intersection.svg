<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">A signalized intersection, plan view</title>
  <desc id="d">Two roads crossing, seen from above: a signal pole with a mast arm on each corner holding signal heads, pedestrian push buttons, detector loops before the stop lines, a controller cabinet, pull boxes and conduit linking them.</desc>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; } .s { font-size: 12px; fill: #595959; }
    .road { fill: #4A4D52; } .walk { fill: #E8E8E8; }
    .loop { fill: none; stroke: #F2B705; stroke-width: 3; }
    .cond { fill: none; stroke: #C92A06; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .lead { stroke: #8A8E91; stroke-width: 1.2; fill: none; }
  </style>
  <rect width="800" height="600" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">A signalized intersection, plan view</text>
  <rect x="20" y="60" width="560" height="520" fill="#DDE6D2"/>
  <!-- roads -->
  <rect class="road" x="220" y="60" width="160" height="520"/>
  <rect class="road" x="20" y="240" width="560" height="160"/>
  <path d="M300 60 V230 M300 410 V580 M20 320 H210 M390 320 H580" stroke="#F2B705" stroke-width="3" stroke-dasharray="14 10"/>
  <!-- crosswalks -->
  <g fill="#F4F4F4">
    <rect x="224" y="218" width="152" height="16" opacity="0.9"/><rect x="224" y="406" width="152" height="16" opacity="0.9"/>
    <rect x="198" y="244" width="16" height="152" opacity="0.9"/><rect x="386" y="244" width="16" height="152" opacity="0.9"/>
  </g>
  <!-- stop lines + loops -->
  <path d="M300 200 H376 M224 440 H300 M180 244 V320 M420 320 V396" stroke="#FFFFFF" stroke-width="4"/>
  <rect class="loop" x="318" y="150" width="40" height="40"/><rect class="loop" x="242" y="450" width="40" height="40"/>
  <rect class="loop" x="130" y="262" width="40" height="40"/><rect class="loop" x="430" y="338" width="40" height="40"/>
  <!-- conduit ring -->
  <path class="cond" d="M200 210 H400 V430 H200 Z"/>
  <path class="cond" d="M200 210 L150 170"/>
  <!-- pull boxes -->
  <g fill="#F4F1EA" stroke="#6B7178" stroke-width="2"><rect x="192" y="202" width="16" height="16"/><rect x="392" y="202" width="16" height="16"/><rect x="392" y="422" width="16" height="16"/><rect x="192" y="422" width="16" height="16"/></g>
  <!-- poles + mast arms + heads -->
  <g stroke="#6B7178" stroke-width="5" stroke-linecap="round"><path d="M410 196 H320"/><path d="M190 444 H280"/><path d="M190 196 V276"/><path d="M410 444 V364"/></g>
  <g fill="#262626"><rect x="334" y="188" width="10" height="16"/><rect x="354" y="188" width="10" height="16"/><rect x="256" y="436" width="10" height="16"/><rect x="236" y="436" width="10" height="16"/>
    <rect x="182" y="256" width="16" height="10"/><rect x="182" y="236" width="16" height="10"/><rect x="402" y="374" width="16" height="10"/><rect x="402" y="394" width="16" height="10"/></g>
  <g fill="#AEB4BA" stroke="#6B7178" stroke-width="2"><circle cx="410" cy="196" r="9"/><circle cx="190" cy="444" r="9"/><circle cx="190" cy="196" r="9"/><circle cx="410" cy="444" r="9"/></g>
  <!-- ped buttons -->
  <g fill="#0070D5"><circle cx="422" cy="208" r="5"/><circle cx="178" cy="432" r="5"/><circle cx="178" cy="208" r="5"/><circle cx="422" cy="432" r="5"/></g>
  <!-- cabinet -->
  <rect x="120" y="140" width="40" height="30" rx="3" fill="#C9CED3" stroke="#6B7178" stroke-width="2"/>

  <!-- legend / labels -->
  <g transform="translate(600 90)">
    <rect x="0" y="0" width="12" height="12" fill="#C9CED3" stroke="#6B7178"/><text class="l" x="22" y="11">Controller cabinet</text>
    <circle cx="6" cy="38" r="7" fill="#AEB4BA" stroke="#6B7178" stroke-width="2"/><text class="l" x="22" y="43">Signal pole and mast arm</text>
    <rect x="1" y="62" width="10" height="16" fill="#262626"/><text class="l" x="22" y="75">Signal heads</text>
    <circle cx="6" cy="102" r="5" fill="#0070D5"/><text class="l" x="22" y="107">Pedestrian push button</text>
    <rect x="0" y="126" width="12" height="12" fill="none" stroke="#F2B705" stroke-width="3"/><text class="l" x="22" y="137">Detector loop</text>
    <rect x="0" y="158" width="12" height="12" fill="#F4F1EA" stroke="#6B7178" stroke-width="2"/><text class="l" x="22" y="169">Pull box</text>
    <path d="M0 196 H14" class="cond"/><text class="l" x="22" y="200">Conduit and cable</text>
    <text class="s" x="0" y="240">Cable runs from the cabinet</text>
    <text class="s" x="0" y="256">through pull boxes to every</text>
    <text class="s" x="0" y="272">pole, head, button and loop.</text>
  </g>

  <text class="s" x="32" y="594">Illustration only, not to scale. Layout, equipment and phasing follow the signal plans of your contract.</text>
</svg>
