<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290.0" role="img" aria-labelledby="t d">
  <title id="t">Where each closeout document comes from</title>
  <desc id="d">As-builts from drawings, approved submittals and O&amp;M manuals from submittals, test reports from inspections and documents, photos of buried work, and the final logs.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="290.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Where each closeout document comes from</text>
    <rect x="24" y="70" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="94" style="fill:#0070D5">As-builts</text>
  <text class="s" x="38" y="113">Drawing markups, kept as work</text>
  <text class="s" x="38" y="129">is installed</text>
  <rect x="281" y="70" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="295" y="94" style="fill:#0070D5">Submittals, O&amp;M, warranties</text>
  <text class="s" x="295" y="113">Closeout items on the register</text>
  <text class="s" x="295" y="129">from day one</text>
  <rect x="537" y="70" width="239" height="87" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="551" y="94" style="fill:#2E7D32">Test reports</text>
  <text class="s" x="551" y="113">Megger, OTDR, ground</text>
  <text class="s" x="551" y="129">resistance, functional tests</text>
  <rect x="24" y="175" width="239" height="87" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="38" y="199" style="fill:#2E7D32">Equipment list</text>
  <text class="s" x="38" y="218">Serial numbers from inspections</text>
  <rect x="281" y="175" width="239" height="87" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="295" y="199" style="fill:#B26A00">Photos</text>
  <text class="s" x="295" y="218">Buried work before backfill</text>
  <rect x="537" y="175" width="239" height="87" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="551" y="199" style="fill:#B26A00">Final logs</text>
  <text class="s" x="551" y="218">RFIs and change orders</text>
</svg>
