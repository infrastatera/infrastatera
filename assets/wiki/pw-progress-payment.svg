<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 229" role="img" aria-labelledby="t d">
  <title id="t">A monthly progress payment</title>
  <desc id="d">Measure quantities, prepare the estimate with supporting documents, agency review and approval, payment within the legal time less retention of up to 5 percent, then pay subcontractors within 7 days.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="229" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">A monthly progress payment</text>
    <rect x="24" y="70" width="128" height="111" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="38" y="94">Measure</text>
  <text class="s" x="38" y="113">quantities</text>
  <text class="s" x="38" y="129">with the</text>
  <text class="s" x="38" y="145">inspector</text>
  <circle cx="136" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="136" y="90" text-anchor="middle">1</text>
  <path d="M154 126 H176" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="180" y="70" width="128" height="111" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="194" y="94">Estimate</text>
  <text class="s" x="194" y="113">pay</text>
  <text class="s" x="194" y="129">application,</text>
  <text class="s" x="194" y="145">payroll,</text>
  <text class="s" x="194" y="161">schedule</text>
  <circle cx="292" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="292" y="90" text-anchor="middle">2</text>
  <path d="M310 126 H332" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="336" y="70" width="128" height="111" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="350" y="94">Approve</text>
  <text class="s" x="350" y="113">engineer</text>
  <text class="s" x="350" y="129">reviews</text>
  <circle cx="448" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="448" y="90" text-anchor="middle">3</text>
  <path d="M466 126 H488" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="492" y="70" width="128" height="111" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="506" y="94">Paid</text>
  <text class="s" x="506" y="113">within 30 days</text>
  <text class="s" x="506" y="129">(local), less</text>
  <text class="s" x="506" y="145">up to 5%</text>
  <text class="s" x="506" y="161">retention</text>
  <circle cx="604" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="604" y="90" text-anchor="middle">4</text>
  <path d="M622 126 H644" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="648" y="70" width="128" height="111" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="662" y="94">Pay subs</text>
  <text class="s" x="662" y="113">their share</text>
  <text class="s" x="662" y="129">within 7 days</text>
  <circle cx="760" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="760" y="90" text-anchor="middle">5</text>
</svg>
