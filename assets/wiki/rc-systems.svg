  <text class="s" x="38" y="145">billing, changes,</text>
  <text class="s" x="38" y="161">hiring, closeout</text>
  <rect x="216" y="70" width="174" height="119" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="230" y="94" style="fill:#2E7D32">Handbook</text>
