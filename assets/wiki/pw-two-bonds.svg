<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">Who each bond protects</title>
  <desc id="d">The performance bond protects the agency if the work is not completed; the payment bond protects subcontractors, suppliers and workers who are not paid; both are usually 100 percent of the contract.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="300" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Who each bond protects</text>
    <rect x="40" y="80" width="330" height="180" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="54" y="104" style="fill:#2E7D32">Performance bond</text>
  <text class="s" x="54" y="123">Protects: the agency</text>
  <text class="s" x="54" y="139">If you default, the surety finishes the</text>
  <text class="s" x="54" y="155">work, pays someone to, or pays up to the</text>
  <text class="s" x="54" y="171">bond amount</text>
  <text class="s" x="54" y="187">Usually 100% of the contract</text>
  <rect x="430" y="80" width="330" height="180" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="444" y="104" style="fill:#B26A00">Payment bond</text>
  <text class="s" x="444" y="123">Protects: subs, suppliers, workers, benefit</text>
  <text class="s" x="444" y="139">funds</text>
  <text class="s" x="444" y="155">Required over $25,000 on California public</text>
  <text class="s" x="444" y="171">works</text>
  <text class="s" x="444" y="187">At least 100% of the contract</text>
  <text class="s" x="444" y="203">Lower tiers need the 20-day notice</text>
</svg>
