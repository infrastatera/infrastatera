<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">Rebound hammer</title>
  <desc id="d">A rebound hammer held perpendicular to a concrete surface; a spring drives a mass against the plunger and the rebound is read on a scale; about ten to twelve readings per test area on a grid at least 25 mm apart.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="330" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Rebound hammer</text>
    <rect x="40" y="70" width="220" height="230" fill="#D9D6CF" stroke="#BDB8AE" stroke-width="2"/>
  <rect x="260" y="160" width="240" height="44" rx="10" fill="#B8C4CF" stroke="#7A8794" stroke-width="2"/><rect x="250" y="174" width="12" height="16" fill="#7A8794"/>
  <rect x="340" y="170" width="70" height="24" rx="3" fill="#FFFFFF" stroke="#7A8794"/>
  <path d="M346 174 V182" stroke="#262626"/>
  <path d="M357 174 V182" stroke="#262626"/>
  <path d="M368 174 V182" stroke="#262626"/>
  <path d="M379 174 V182" stroke="#262626"/>
  <path d="M390 174 V182" stroke="#262626"/>
  <path d="M401 174 V182" stroke="#262626"/>
  <text class="s" x="375" y="150" text-anchor="middle">rebound scale</text>
  <path d="M520 182 H600" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#am)"/>
  <text class="s" x="560" y="172" text-anchor="middle">push</text>
  <text class="s" x="150" y="320" text-anchor="middle">perpendicular to a clean, flat surface</text>
  <text class="l" x="600" y="80">Test area: 12 readings</text>
  <circle cx="620" cy="120" r="6" fill="#0070D5"/>
  <circle cx="660" cy="120" r="6" fill="#0070D5"/>
  <circle cx="700" cy="120" r="6" fill="#0070D5"/>
  <circle cx="740" cy="120" r="6" fill="#0070D5"/>
  <circle cx="620" cy="160" r="6" fill="#0070D5"/>
  <circle cx="660" cy="160" r="6" fill="#0070D5"/>
  <circle cx="700" cy="160" r="6" fill="#0070D5"/>
  <circle cx="740" cy="160" r="6" fill="#0070D5"/>
  <circle cx="620" cy="200" r="6" fill="#0070D5"/>
