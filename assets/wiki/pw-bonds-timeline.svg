<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">Three bonds over the life of a job</title>
  <desc id="d">Bid bond at bid time, usually 10% of the bid; performance and payment bonds at contract signing, usually 100% each; each bond has a principal, an obligee and a surety.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="330" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Three bonds over the life of a job</text>
    <path d="M40 150 H760" stroke="#D5D9DE" stroke-width="4"/>
  <circle cx="120" cy="150" r="8" fill="#0070D5"/>
  <text class="l" x="120" y="178" text-anchor="middle">Bid</text>
  <circle cx="400" cy="150" r="8" fill="#0070D5"/>
  <text class="l" x="400" y="178" text-anchor="middle">Award and signing</text>
  <circle cx="700" cy="150" r="8" fill="#0070D5"/>
  <text class="l" x="700" y="178" text-anchor="middle">Completion</text>
  <rect x="30" y="62" width="190" height="66" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="44" y="86" style="fill:#0070D5">Bid bond</text>
  <text class="s" x="44" y="105">usually 10% of the bid</text>
  <rect x="262" y="62" width="236" height="66" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="276" y="86" style="fill:#2E7D32">Performance bond</text>
  <text class="s" x="276" y="105">usually 100%: work gets done</text>
  <rect x="514" y="62" width="256" height="79" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="528" y="86" style="fill:#B26A00">Payment bond</text>
  <text class="s" x="528" y="105">100%: subs, suppliers, workers</text>
  <text class="s" x="528" y="121">paid</text>
  <rect x="40" y="214" width="220" height="84" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="54" y="238">Principal</text>
  <text class="s" x="54" y="257">you, the contractor: you</text>
  <text class="s" x="54" y="273">repay the surety</text>
  <rect x="290" y="214" width="220" height="84" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="304" y="238">Obligee</text>
  <text class="s" x="304" y="257">the agency the bond protects</text>
  <rect x="540" y="214" width="220" height="84" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="554" y="238">Surety</text>
  <text class="s" x="554" y="257">guarantees, then recovers</text>
  <text class="s" x="554" y="273">from the principal</text>
</svg>
