<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">The contract documents and which one governs</title>
  <desc id="d">Six documents stacked from top to bottom in the order they govern when they disagree: Special Provisions, project plans, Standard Specifications as revised, Revised Standard Plans, Standard Plans, supplemental project information. A side note: written numbers on a drawing govern over the graphics.</desc>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 15px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 18px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="440" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">The contract documents and which one governs</text>
  <text class="s" x="32" y="62">When they disagree, the higher one wins (Section 5-1.02).</text>

  <g>
    <rect x="32" y="80" width="460" height="46" rx="10" fill="#0070D5"/><text class="n" x="50" y="110">1</text><text class="l" x="80" y="102" style="fill:#FFFFFF">Special Provisions</text><text class="s" x="80" y="118" style="fill:#DCEBFA">written for this project</text>
    <rect x="52" y="134" width="440" height="46" rx="10" fill="#2D84D9"/><text class="n" x="70" y="164">2</text><text class="l" x="100" y="156" style="fill:#FFFFFF">Project plans</text><text class="s" x="100" y="172" style="fill:#DCEBFA">what to build and where</text>
    <rect x="72" y="188" width="420" height="46" rx="10" fill="#5A9BE0"/><text class="n" x="90" y="218">3</text><text class="l" x="120" y="210" style="fill:#FFFFFF">Standard Specifications</text><text class="s" x="120" y="226" style="fill:#EEF5FC">as revised by the Revised Standard Specifications</text>
    <rect x="92" y="242" width="400" height="46" rx="10" fill="#86B3E8"/><text class="n" x="110" y="272">4</text><text class="l" x="140" y="270">Revised Standard Plans</text>
    <rect x="112" y="296" width="380" height="46" rx="10" fill="#B3CFF0"/><text class="n" x="130" y="326" style="fill:#262626">5</text><text class="l" x="160" y="324">Standard Plans</text>
    <rect x="132" y="350" width="360" height="46" rx="10" fill="#DCE8F7"/><text class="n" x="150" y="380" style="fill:#262626">6</text><text class="l" x="180" y="378">Supplemental project information</text>
  </g>

  <rect x="530" y="80" width="240" height="140" rx="14" fill="#F7F9FA" stroke="#D5D9DE"/>
  <text class="l" x="548" y="108">On a drawing</text>
  <text class="s" x="548" y="130">written numbers and notes</text>
  <text class="s" x="548" y="146">govern over the graphics:</text>
  <text class="s" x="548" y="162">use the dimension, don't</text>
  <text class="s" x="548" y="178">scale the drawing.</text>
  <rect x="530" y="236" width="240" height="120" rx="14" fill="#FFF6F2"/>
  <text class="l" x="548" y="264">Still unclear?</text>
  <text class="s" x="548" y="286">Write an RFI to the</text>
  <text class="s" x="548" y="302">Resident Engineer and wait</text>
  <text class="s" x="548" y="318">for a written answer.</text>

  <text class="s" x="32" y="424">Based on Section 5-1.02 of recent editions. Confirm the order in the edition named in your contract.</text>
</svg>
