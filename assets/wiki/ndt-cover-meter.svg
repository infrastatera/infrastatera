<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">Locating bars with a cover meter</title>
  <desc id="d">A plan view of a slab with two layers of bars; the cover meter probe scans across the top bars, then along them to find the second layer; a cover map shows shallow cover in red.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="330" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Locating bars with a cover meter</text>
    <rect x="40" y="70" width="340" height="230" fill="#D9D6CF" stroke="#BDB8AE" stroke-width="2"/>
  <path d="M70 70 V300" stroke="#7A8794" stroke-width="6" opacity="0.8"/>
  <path d="M120 70 V300" stroke="#7A8794" stroke-width="6" opacity="0.8"/>
  <path d="M170 70 V300" stroke="#7A8794" stroke-width="6" opacity="0.8"/>
  <path d="M220 70 V300" stroke="#7A8794" stroke-width="6" opacity="0.8"/>
  <path d="M270 70 V300" stroke="#7A8794" stroke-width="6" opacity="0.8"/>
  <path d="M320 70 V300" stroke="#7A8794" stroke-width="6" opacity="0.8"/>
  <path d="M370 70 V300" stroke="#7A8794" stroke-width="6" opacity="0.8"/>
  <path d="M40 100 H380" stroke="#7A8794" stroke-width="5" opacity="0.45"/>
  <path d="M40 160 H380" stroke="#7A8794" stroke-width="5" opacity="0.45"/>
  <path d="M40 220 H380" stroke="#7A8794" stroke-width="5" opacity="0.45"/>
  <path d="M40 280 H380" stroke="#7A8794" stroke-width="5" opacity="0.45"/>
  <rect x="130" y="180" width="70" height="34" rx="6" fill="#0070D5"/>
  <path d="M210 197 H300" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="s" x="240" y="186">scan</text>
  <text class="s" x="210" y="320" text-anchor="middle">scan across, then along, to find both layers</text>
  <text class="l" x="430" y="84">Cover map (inches)</text>
  <rect x="430" y="100" width="76" height="52" fill="#EAF5EB" stroke="#2E7D32"/>
  <text class="l" x="468" y="131" text-anchor="middle" style="fill:#2E7D32">2.1</text>
  <rect x="510" y="100" width="76" height="52" fill="#EAF5EB" stroke="#2E7D32"/>
  <text class="l" x="548" y="131" text-anchor="middle" style="fill:#2E7D32">2.3</text>
  <rect x="590" y="100" width="76" height="52" fill="#FDEDEA" stroke="#C92A06"/>
  <text class="l" x="628" y="131" text-anchor="middle" style="fill:#C92A06">1.2</text>
  <rect x="670" y="100" width="76" height="52" fill="#FDEDEA" stroke="#C92A06"/>
  <text class="l" x="708" y="131" text-anchor="middle" style="fill:#C92A06">0.9</text>
  <rect x="430" y="156" width="76" height="52" fill="#EAF5EB" stroke="#2E7D32"/>
  <text class="l" x="468" y="187" text-anchor="middle" style="fill:#2E7D32">2.4</text>
  <rect x="510" y="156" width="76" height="52" fill="#EAF5EB" stroke="#2E7D32"/>
  <text class="l" x="548" y="187" text-anchor="middle" style="fill:#2E7D32">2.2</text>
  <rect x="590" y="156" width="76" height="52" fill="#FDEDEA" stroke="#C92A06"/>
  <text class="l" x="628" y="187" text-anchor="middle" style="fill:#C92A06">1.4</text>
  <rect x="670" y="156" width="76" height="52" fill="#FDEDEA" stroke="#C92A06"/>
  <text class="l" x="708" y="187" text-anchor="middle" style="fill:#C92A06">1.1</text>
  <rect x="430" y="212" width="76" height="52" fill="#EAF5EB" stroke="#2E7D32"/>
  <text class="l" x="468" y="243" text-anchor="middle" style="fill:#2E7D32">2.5</text>
  <rect x="510" y="212" width="76" height="52" fill="#EAF5EB" stroke="#2E7D32"/>
  <text class="l" x="548" y="243" text-anchor="middle" style="fill:#2E7D32">2.4</text>
  <rect x="590" y="212" width="76" height="52" fill="#EAF5EB" stroke="#2E7D32"/>
  <text class="l" x="628" y="243" text-anchor="middle" style="fill:#2E7D32">2.0</text>
  <rect x="670" y="212" width="76" height="52" fill="#FFF4E0" stroke="#B26A00"/>
  <text class="l" x="708" y="243" text-anchor="middle" style="fill:#B26A00">1.8</text>
  <text class="s" x="430" y="290">Red: thin cover, corrosion starts sooner.</text>
  <text class="s" x="430" y="306">Confirm with a few drilled holes.</text>
</svg>
