<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="t d">
  <title id="t">When the qualifier leaves</title>
  <desc id="d">The qualifier leaves on day 0; CSLB must be notified in writing and a replacement made within 90 days; one 90-day extension can be requested in limited cases; otherwise the license is suspended.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="260" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">When the qualifier leaves</text>
    <path d="M40 96 H760" stroke="#D5D9DE" stroke-width="4"/>
  <circle cx="100" cy="96" r="9" fill="#B26A00"/>
  <text class="l" x="100" y="130" text-anchor="middle" style="fill:#B26A00">Day 0</text>
  <text class="s" x="100" y="150" text-anchor="middle">qualifier leaves</text>
  <circle cx="250" cy="96" r="9" fill="#0070D5"/>
  <text class="l" x="250" y="130" text-anchor="middle">Notify CSLB</text>
  <text class="s" x="250" y="150" text-anchor="middle">in writing, within</text>
  <text class="s" x="250" y="165" text-anchor="middle">90 days</text>
  <circle cx="400" cy="96" r="9" fill="#2E7D32"/>
  <text class="l" x="400" y="130" text-anchor="middle" style="fill:#2E7D32">Replace</text>
  <text class="s" x="400" y="150" text-anchor="middle">new RMO or RME</text>
  <text class="s" x="400" y="165" text-anchor="middle">within 90 days</text>
  <circle cx="550" cy="96" r="9" fill="#C92A06"/>
  <text class="l" x="550" y="130" text-anchor="middle" style="fill:#C92A06">Day 90</text>
  <text class="s" x="550" y="150" text-anchor="middle">automatic suspension</text>
  <text class="s" x="550" y="165" text-anchor="middle">if not replaced</text>
  <circle cx="700" cy="96" r="9" fill="#595959"/>
  <text class="l" x="700" y="130" text-anchor="middle" style="fill:#595959">Extension</text>
  <text class="s" x="700" y="150" text-anchor="middle">one 90-day petition,</text>
  <text class="s" x="700" y="165" text-anchor="middle">limited cases</text>
  <text class="s" x="32" y="242">The departing qualifier stays responsible for work done before their recorded departure.</text>
</svg>
