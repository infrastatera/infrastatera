<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 257.0" role="img" aria-labelledby="t d">
  <title id="t">Union or open shop</title>
  <desc id="d">Union: hall hiring, set wages and benefits, joint apprenticeship, work rules, access to labor-agreement projects. Open shop: direct hiring, own pay above legal minimums, own training, flexibility.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="257.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Union or open shop</text>
    <text class="s" x="32" y="74">On public works, prevailing wage applies either way.</text>
  <rect x="24" y="94" width="367" height="135" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="118" style="fill:#0070D5">Union (signatory)</text>
  <text class="s" x="38" y="137">Hiring through the hall</text>
  <text class="s" x="38" y="153">Wages and benefits set by the agreement</text>
  <text class="s" x="38" y="169">Joint apprenticeship program</text>
  <text class="s" x="38" y="185">Work rules and ratios</text>
  <text class="s" x="38" y="201">Access to PLA projects</text>
  <rect x="409" y="94" width="367" height="135" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="423" y="118" style="fill:#2E7D32">Open shop</text>
  <text class="s" x="423" y="137">You recruit directly</text>
  <text class="s" x="423" y="153">You set pay above minimums</text>
  <text class="s" x="423" y="169">Your own or state programs</text>
  <text class="s" x="423" y="185">You decide how to staff</text>
  <text class="s" x="423" y="201">PLA terms apply on PLA jobs</text>
</svg>
