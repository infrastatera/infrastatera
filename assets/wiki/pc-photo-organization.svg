<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 217.0" role="img" aria-labelledby="t d">
  <title id="t">Photos you can find a year later</title>
  <desc id="d">Organize photos by location, by phase and by the record they support, with a description and something for scale.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="217.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Photos you can find a year later</text>
    <rect x="24" y="70" width="239" height="119" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="94" style="fill:#0070D5">By location</text>
  <text class="s" x="38" y="113">Station range, pole, pull box</text>
  <text class="s" x="38" y="129">number</text>
  <text class="s" x="38" y="145">Albums named the way the plans</text>
  <text class="s" x="38" y="161">name places</text>
  <rect x="281" y="70" width="239" height="119" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="295" y="94" style="fill:#2E7D32">By phase</text>
  <text class="s" x="295" y="113">Before, underground,</text>
  <text class="s" x="295" y="129">structures, cable, final</text>
  <text class="s" x="295" y="145">Buried work before backfill,</text>
  <text class="s" x="295" y="161">always</text>
  <rect x="537" y="70" width="239" height="119" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="551" y="94" style="fill:#B26A00">By record</text>
  <text class="s" x="551" y="113">Linked to the daily log, RFI,</text>
  <text class="s" x="551" y="129">observation or drawing</text>
  <text class="s" x="551" y="145">Short description: what, where,</text>
  <text class="s" x="551" y="161">why</text>
</svg>
