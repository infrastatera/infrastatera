<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290.0" role="img" aria-labelledby="t d">
  <title id="t">Clauses to read before signing</title>
  <desc id="d">Scope, payment, risk transfer, time, changes, disputes and termination.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="290.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Clauses to read before signing</text>
    <rect x="24" y="70" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="94" style="fill:#0070D5">Scope</text>
  <text class="s" x="38" y="113">Plans, specs, addenda</text>
  <text class="s" x="38" y="129">Your exclusions attached</text>
  <rect x="281" y="70" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="295" y="94" style="fill:#0070D5">Payment</text>
  <text class="s" x="295" y="113">Dates, retention</text>
  <text class="s" x="295" y="129">Pay-when-paid terms</text>
  <rect x="537" y="70" width="239" height="87" rx="12" fill="#FDEDEA" stroke="#C92A06" stroke-width="1.5"/>
  <text class="l" x="551" y="94" style="fill:#C92A06">Risk</text>
  <text class="s" x="551" y="113">Indemnity, insurance</text>
  <text class="s" x="551" y="129">Flow-down from the prime</text>
  <rect x="24" y="175" width="239" height="87" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="38" y="199" style="fill:#B26A00">Time</text>
  <text class="s" x="38" y="218">Schedule, liquidated damages</text>
  <text class="s" x="38" y="234">Time for others' delays</text>
  <rect x="281" y="175" width="239" height="87" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="295" y="199" style="fill:#B26A00">Changes</text>
  <text class="s" x="295" y="218">Who orders, notice deadlines</text>
  <text class="s" x="295" y="234">How priced</text>
  <rect x="537" y="175" width="239" height="87" rx="12" fill="#F2F3F5" stroke="#595959" stroke-width="1.5"/>
  <text class="l" x="551" y="199">Disputes and exit</text>
  <text class="s" x="551" y="218">Claims process, venue</text>
  <text class="s" x="551" y="234">Termination terms</text>
</svg>
