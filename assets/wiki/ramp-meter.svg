<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">A ramp meter, plan view</title>
  <desc id="d">An on-ramp joining a freeway, seen from above: an advance warning sign, queue detectors near the ramp entrance, demand detectors before the stop line, the meter signals at the stop line, passage detectors after it, mainline detectors on the freeway, and the cabinet linked to the TMC.</desc>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; }
    .loop { fill: none; stroke: #F2B705; stroke-width: 3; }
    .lead { stroke: #8A8E91; stroke-width: 1.2; fill: none; }
  </style>
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">A ramp meter, plan view</text>
  <rect x="20" y="60" width="760" height="370" fill="#DDE6D2"/>
  <!-- freeway -->
  <rect x="20" y="80" width="760" height="110" fill="#4A4D52"/>
  <path d="M20 117 H780 M20 153 H780" stroke="#F4F4F4" stroke-width="2" stroke-dasharray="18 14"/>
  <!-- ramp -->
  <path d="M60 400 C300 400 420 330 560 200 L620 190 L660 190 C520 330 360 430 60 430 Z" fill="#4A4D52"/>
  <!-- stop line -->
  <path d="M452 318 L478 340" stroke="#FFFFFF" stroke-width="4"/>
  <!-- detectors -->
  <rect class="loop" x="150" y="402" width="30" height="20" transform="rotate(-3 165 412)"/>
  <rect class="loop" x="390" y="350" width="30" height="20" transform="rotate(-30 405 360)"/>
  <rect class="loop" x="500" y="282" width="30" height="20" transform="rotate(-38 515 292)"/>
  <rect class="loop" x="640" y="88" width="30" height="22"/><rect class="loop" x="640" y="124" width="30" height="22"/><rect class="loop" x="640" y="160" width="30" height="22"/>
  <!-- meter signals -->
  <rect x="482" y="340" width="14" height="30" rx="3" fill="#262626"/><circle cx="489" cy="349" r="4" fill="#C92A06"/><circle cx="489" cy="361" r="4" fill="#2E7D32"/>
  <!-- advance sign -->
  <rect x="94" y="352" width="60" height="30" rx="3" fill="#F2B705" stroke="#B98900"/><text x="124" y="372" text-anchor="middle" style="font-size:9px;font-weight:600">METER ON</text>
  <!-- cabinet -->
  <rect x="560" y="330" width="34" height="28" rx="3" fill="#C9CED3" stroke="#6B7178" stroke-width="2"/>
  <path d="M594 344 H690 V240" stroke="#0070D5" stroke-width="2" stroke-dasharray="6 4" fill="none"/>

  <!-- labels -->
  <text class="l" x="40" y="300">Advance sign</text><path class="lead" d="M100 304 V352"/>
  <path class="lead" d="M165 402 V352"/><text class="l" x="150" y="346">Queue detector</text>
  <path class="lead" d="M400 350 L360 300"/><text class="l" x="250" y="296">Demand detector</text>
  <path class="lead" d="M496 352 H540"/><text class="l" x="420" y="400">Meter signals at the stop line</text>
  <path class="lead" d="M520 282 L540 250"/><text class="l" x="470" y="244">Passage detector</text>
  <text class="l" x="520" y="75">Mainline detectors</text><path class="lead" d="M650 78 V88"/>
  <text class="l" x="600" y="380">Cabinet</text>
  <text class="l" x="700" y="236" style="fill:#0070D5">to TMC</text>

  <text class="s" x="32" y="452">Illustration only. Detector layout, lane numbering and signs follow the ramp metering plans of your contract.</text>
</svg>
