<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 346.0" role="img" aria-labelledby="t d">
  <title id="t">A takeoff, component by component</title>
  <desc id="d">Conduit by size and method, pull boxes by type, conductors with slack, fiber with splices, foundations, poles and equipment, and what the plans do not show.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="346.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">A takeoff, component by component</text>
    <text class="s" x="32" y="74">Organize by bid item and system, then location; check totals against the quantity sheets.</text>
  <rect x="24" y="94" width="174" height="103" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="118" style="fill:#0070D5">Conduit</text>
  <text class="s" x="38" y="137">Size, type, method</text>
  <text class="s" x="38" y="153">Trench, bore,</text>
  <text class="s" x="38" y="169">structure</text>
  <rect x="216" y="94" width="174" height="103" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="230" y="118" style="fill:#0070D5">Pull boxes</text>
  <text class="s" x="230" y="137">Type, size, traffic</text>
  <text class="s" x="230" y="153">rating</text>
  <rect x="409" y="94" width="174" height="103" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="423" y="118" style="fill:#0070D5">Conductors</text>
  <text class="s" x="423" y="137">Run by run, plus</text>
  <text class="s" x="423" y="153">slack</text>
  <rect x="602" y="94" width="174" height="103" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="616" y="118" style="fill:#0070D5">Fiber</text>
  <text class="s" x="616" y="137">Count, splices, tests</text>
  <rect x="24" y="215" width="174" height="103" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="38" y="239" style="fill:#2E7D32">Foundations</text>
  <text class="s" x="38" y="258">Type, depth, anchor</text>
  <text class="s" x="38" y="274">bolts</text>
  <rect x="216" y="215" width="174" height="103" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="230" y="239" style="fill:#2E7D32">Poles, standards</text>
  <text class="s" x="230" y="258">Type, arms, lead time</text>
  <rect x="409" y="215" width="174" height="103" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="423" y="239" style="fill:#2E7D32">Equipment</text>
  <text class="s" x="423" y="258">Cabinets,</text>
  <text class="s" x="423" y="274">controllers, cameras</text>
  <rect x="602" y="215" width="174" height="103" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="616" y="239" style="fill:#B26A00">Not on the plans</text>
  <text class="s" x="616" y="258">Slack, waste,</text>
  <text class="s" x="616" y="274">testing,</text>
  <text class="s" x="616" y="290">temporary systems</text>
