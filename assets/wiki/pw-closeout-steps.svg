<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 246" role="img" aria-labelledby="t d">
  <title id="t">The end of a public job</title>
  <desc id="d">Close the punch list, the agency accepts the work, the notice of completion is recorded, submit the final estimate and paperwork, the agency releases retention within 60 days after completion.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="246" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">The end of a public job</text>
    <rect x="24" y="70" width="128" height="128" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="38" y="94">Punch list</text>
  <text class="s" x="38" y="113">finish and</text>
  <text class="s" x="38" y="129">correct</text>
  <circle cx="136" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="136" y="90" text-anchor="middle">1</text>
  <path d="M154 134 H176" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="180" y="70" width="128" height="128" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="194" y="94">Acceptance</text>
  <text class="s" x="194" y="113">by the</text>
  <text class="s" x="194" y="129">engineer or</text>
  <text class="s" x="194" y="145">the board</text>
  <circle cx="292" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="292" y="90" text-anchor="middle">2</text>
  <path d="M310 134 H332" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="336" y="70" width="128" height="128" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="350" y="94">Notice of</text>
  <text class="l" x="350" y="111">completion</text>
  <text class="s" x="350" y="130">recorded;</text>
  <text class="s" x="350" y="146">payment</text>
  <text class="s" x="350" y="162">deadlines</text>
  <text class="s" x="350" y="178">start</text>
  <circle cx="448" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="448" y="90" text-anchor="middle">3</text>
  <path d="M466 134 H488" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="492" y="70" width="128" height="128" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="506" y="94">Final</text>
  <text class="l" x="506" y="111">estimate</text>
  <text class="s" x="506" y="130">quantities,</text>
  <text class="s" x="506" y="146">change orders,</text>
  <text class="s" x="506" y="162">payroll,</text>
  <text class="s" x="506" y="178">releases</text>
  <circle cx="604" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="604" y="90" text-anchor="middle">4</text>
  <path d="M622 134 H644" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="648" y="70" width="128" height="128" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="662" y="94">Retention</text>
  <text class="s" x="662" y="113">released</text>
  <text class="s" x="662" y="129">within 60</text>
  <text class="s" x="662" y="145">days, less up</text>
  <text class="s" x="662" y="161">to 150% of</text>
  <text class="s" x="662" y="177">disputes</text>
  <circle cx="760" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="760" y="90" text-anchor="middle">5</text>
</svg>
