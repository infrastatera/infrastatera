<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 257.0" role="img" aria-labelledby="t d">
  <title id="t">What a bid item covers</title>
  <desc id="d">Unit price items paid by measured quantity, lump sum electrical systems that include everything on their plan sheets, and work paid in other items or included without separate payment.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="257.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">What a bid item covers</text>
    <text class="s" x="32" y="74">Read the measurement and payment clause for every item before pricing.</text>
  <rect x="24" y="94" width="239" height="135" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="118" style="fill:#0070D5">Unit price item</text>
  <text class="s" x="38" y="137">Paid by measured quantity</text>
  <text class="s" x="38" y="153">Price × final quantity</text>
  <rect x="281" y="94" width="239" height="135" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="295" y="118" style="fill:#2E7D32">Lump sum system</text>
  <text class="s" x="295" y="137">Everything on its plan view</text>
  <text class="s" x="295" y="153">sheet</text>
  <text class="s" x="295" y="169">Conduit, boxes, wire, poles,</text>
  <text class="s" x="295" y="185">testing</text>
  <text class="s" x="295" y="201">Cost breakdown for progress pay</text>
  <rect x="537" y="94" width="239" height="135" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="551" y="118" style="fill:#B26A00">Paid elsewhere or included</text>
  <text class="s" x="551" y="137">Traffic control, mobilization</text>
  <text class="s" x="551" y="153">Work with no item: carry it</text>
</svg>
