<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 236" role="img" aria-labelledby="t d">
  <title id="t">How a labor compliance problem becomes an assessment</title>
  <desc id="d">A complaint or payroll review leads to an investigation and records request; the Labor Commissioner may issue a civil wage and penalty assessment; there are short deadlines to request review; unpaid wages may add liquidated damages; serious cases lead to debarment.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="236" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">How a labor compliance problem becomes an assessment</text>
    <rect x="24" y="70" width="128" height="118" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="38" y="94">Trigger</text>
  <text class="s" x="38" y="113">worker</text>
  <text class="s" x="38" y="129">complaint,</text>
  <text class="s" x="38" y="145">agency payroll</text>
  <text class="s" x="38" y="161">review, audit</text>
  <circle cx="136" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="136" y="90" text-anchor="middle">1</text>
  <path d="M154 129 H176" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="180" y="70" width="128" height="118" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="194" y="94">Records</text>
  <text class="l" x="194" y="111">request</text>
  <text class="s" x="194" y="130">payroll and</text>
  <text class="s" x="194" y="146">time records,</text>
  <text class="s" x="194" y="162">by a deadline</text>
  <circle cx="292" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="292" y="90" text-anchor="middle">2</text>
  <path d="M310 129 H332" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="336" y="70" width="128" height="118" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="350" y="94">Assessment</text>
  <text class="s" x="350" y="113">back wages</text>
  <text class="s" x="350" y="129">plus penalties</text>
  <text class="s" x="350" y="145">per worker per</text>
  <text class="s" x="350" y="161">day</text>
  <circle cx="448" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="448" y="90" text-anchor="middle">3</text>
  <path d="M466 129 H488" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="492" y="70" width="128" height="118" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="506" y="94">Review</text>
  <text class="s" x="506" y="113">short deadline</text>
  <text class="s" x="506" y="129">to request a</text>
  <text class="s" x="506" y="145">hearing</text>
  <circle cx="604" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="604" y="90" text-anchor="middle">4</text>
  <path d="M622 129 H644" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="648" y="70" width="128" height="118" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="662" y="94">Outcome</text>
  <text class="s" x="662" y="113">pay, settle,</text>
  <text class="s" x="662" y="129">or debarment</text>
  <text class="s" x="662" y="145">for serious</text>
  <text class="s" x="662" y="161">cases</text>
  <circle cx="760" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="760" y="90" text-anchor="middle">5</text>
</svg>
