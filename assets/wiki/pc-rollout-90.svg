<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="t d">
  <title id="t">A 90-day rollout in three waves</title>
  <desc id="d">Before day 1: owner and company setup. Days 1 to 30: drawings, daily log, photos. Days 31 to 60: RFIs, submittals, meetings, inspections. Days 61 to 90: budget, commitments, change events, billing. Then more jobs.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="260" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">A 90-day rollout in three waves</text>
    <path d="M40 96 H760" stroke="#D5D9DE" stroke-width="4"/>
  <circle cx="100" cy="96" r="9" fill="#595959"/>
  <text class="l" x="100" y="130" text-anchor="middle" style="fill:#595959">Before day 1</text>
  <text class="s" x="100" y="150" text-anchor="middle">owner, company</text>
  <text class="s" x="100" y="165" text-anchor="middle">setup, one job</text>
  <circle cx="250" cy="96" r="9" fill="#2E7D32"/>
  <text class="l" x="250" y="130" text-anchor="middle" style="fill:#2E7D32">Days 1-30</text>
  <text class="s" x="250" y="150" text-anchor="middle">drawings, daily log,</text>
  <text class="s" x="250" y="165" text-anchor="middle">photos</text>
  <circle cx="400" cy="96" r="9" fill="#0070D5"/>
  <text class="l" x="400" y="130" text-anchor="middle">Days 31-60</text>
  <text class="s" x="400" y="150" text-anchor="middle">RFIs, submittals,</text>
  <text class="s" x="400" y="165" text-anchor="middle">inspections</text>
  <circle cx="550" cy="96" r="9" fill="#B26A00"/>
  <text class="l" x="550" y="130" text-anchor="middle" style="fill:#B26A00">Days 61-90</text>
  <text class="s" x="550" y="150" text-anchor="middle">budget, changes,</text>
  <text class="s" x="550" y="165" text-anchor="middle">billing</text>
  <circle cx="700" cy="96" r="9" fill="#2E7D32"/>
  <text class="l" x="700" y="130" text-anchor="middle" style="fill:#2E7D32">After</text>
  <text class="s" x="700" y="150" text-anchor="middle">more jobs,</text>
  <text class="s" x="700" y="165" text-anchor="middle">integrations</text>
  <text class="s" x="32" y="242">Start a wave only when the previous one is used every day.</text>
</svg>
