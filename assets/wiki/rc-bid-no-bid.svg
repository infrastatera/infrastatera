<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290.0" role="img" aria-labelledby="t d">
  <title id="t">Bid or no bid</title>
  <desc id="d">Score fit, capacity, bonding and cash, owner, risk, competition and margin; bid only above a minimum score.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="290.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Bid or no bid</text>
    <rect x="24" y="70" width="174" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="94" style="fill:#0070D5">Fit</text>
  <text class="s" x="38" y="113">Your work, your</text>
  <text class="s" x="38" y="129">customers</text>
  <rect x="216" y="70" width="174" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="230" y="94" style="fill:#0070D5">Capacity</text>
  <text class="s" x="230" y="113">Crews, foremen,</text>
  <text class="s" x="230" y="129">equipment</text>
  <rect x="409" y="70" width="174" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="423" y="94" style="fill:#0070D5">Bonding and cash</text>
  <text class="s" x="423" y="113">Within limits, first</text>
  <text class="s" x="423" y="129">90 days</text>
  <rect x="602" y="70" width="174" height="87" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="616" y="94" style="fill:#2E7D32">Owner / GC</text>
  <text class="s" x="616" y="113">Pays well, treats</text>
  <text class="s" x="616" y="129">subs fairly</text>
  <rect x="24" y="175" width="174" height="87" rx="12" fill="#FDEDEA" stroke="#C92A06" stroke-width="1.5"/>
  <text class="l" x="38" y="199" style="fill:#C92A06">Risk</text>
  <text class="s" x="38" y="218">Terms, damages,</text>
  <text class="s" x="38" y="234">schedule, site</text>
  <rect x="216" y="175" width="174" height="87" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="230" y="199" style="fill:#B26A00">Competition</text>
  <text class="s" x="230" y="218">Bidders, spread</text>
  <rect x="409" y="175" width="174" height="87" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="423" y="199" style="fill:#2E7D32">Margin</text>
  <text class="s" x="423" y="218">After overhead</text>
  <rect x="602" y="175" width="174" height="87" rx="12" fill="#F2F3F5" stroke="#595959" stroke-width="1.5"/>
  <text class="l" x="616" y="199">Score</text>
  <text class="s" x="616" y="218">Below the minimum:</text>
  <text class="s" x="616" y="234">pass</text>
</svg>
