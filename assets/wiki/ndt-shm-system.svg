<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d">
  <title id="t">A monitoring system</title>
  <desc id="d">A bridge with crack meters, strain gauges, tiltmeters, accelerometers and a temperature sensor wired to a solar-powered data logger that sends data over cellular to a dashboard with alert thresholds.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="340" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">A monitoring system</text>
    <rect x="40" y="150" width="520" height="22" fill="#BDB8AE"/><rect x="120" y="172" width="30" height="110" fill="#D9D6CF"/><rect x="450" y="172" width="30" height="110" fill="#D9D6CF"/>
  <rect x="192" y="164" width="16" height="16" rx="3" fill="#B26A00"/>
  <text class="s" x="200" y="200" text-anchor="middle">crack meter</text>
  <rect x="292" y="164" width="16" height="16" rx="3" fill="#0070D5"/>
  <text class="s" x="300" y="214" text-anchor="middle">strain gauge</text>
  <rect x="127" y="222" width="16" height="16" rx="3" fill="#2E7D32"/>
  <text class="s" x="135" y="258" text-anchor="middle">tiltmeter</text>
  <rect x="372" y="142" width="16" height="16" rx="3" fill="#C92A06"/>
  <text class="s" x="380" y="132" text-anchor="middle">accelerometer</text>
  <rect x="512" y="142" width="16" height="16" rx="3" fill="#595959"/>
  <text class="s" x="520" y="132" text-anchor="middle">temperature</text>
  <rect x="600" y="210" width="70" height="60" rx="6" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
  <text class="s" x="635" y="246" text-anchor="middle">logger</text>
  <path d="M600 190 L620 170 L640 190 Z" fill="#B26A00"/>
  <text class="s" x="620" y="162" text-anchor="middle">solar</text>
  <path d="M560 240 H596" stroke="#262626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="620" y="70" width="160" height="80" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="634" y="94" style="fill:#0070D5">Dashboard</text>
  <text class="s" x="634" y="113">alert and alarm</text>
  <text class="s" x="634" y="129">thresholds</text>
  <path d="M660 208 L690 154" stroke="#0070D5" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#a)"/>
  <text class="s" x="700" y="190">cellular</text>
  <text class="s" x="32" y="318">Record temperature: daily movement is not damage. Take a baseline before the works you monitor.</text>
</svg>
