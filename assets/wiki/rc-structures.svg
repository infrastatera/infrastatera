<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 273.0" role="img" aria-labelledby="t d">
  <title id="t">Four business structures</title>
  <desc id="d">Sole owner, partnership, corporation and LLC compared on liability, who qualifies the license and extra requirements.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="273.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Four business structures</text>
    <text class="s" x="32" y="74">Pick with your CPA before applying: changing structure later usually means a new license.</text>
  <rect x="24" y="94" width="174" height="151" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="38" y="118" style="fill:#B26A00">Sole owner</text>
  <text class="s" x="38" y="137">Owner personally</text>
  <text class="s" x="38" y="153">liable</text>
  <text class="s" x="38" y="169">Owner or RME</text>
  <text class="s" x="38" y="185">qualifies</text>
  <rect x="216" y="94" width="174" height="151" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="230" y="118" style="fill:#B26A00">Partnership</text>
  <text class="s" x="230" y="137">Partners personally</text>
  <text class="s" x="230" y="153">liable</text>
  <text class="s" x="230" y="169">Partner or RME</text>
  <text class="s" x="230" y="185">qualifies</text>
  <rect x="409" y="94" width="174" height="151" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="423" y="118" style="fill:#0070D5">Corporation</text>
  <text class="s" x="423" y="137">Liability generally</text>
  <text class="s" x="423" y="153">stays in the company</text>
  <text class="s" x="423" y="169">RMO or RME qualifies</text>
  <rect x="602" y="94" width="174" height="151" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="616" y="118" style="fill:#2E7D32">LLC</text>
  <text class="s" x="616" y="137">Liability generally</text>
  <text class="s" x="616" y="153">stays in the company</text>
  <text class="s" x="616" y="169">Extra $100,000 worker</text>
  <text class="s" x="616" y="185">bond</text>
  <text class="s" x="616" y="201">Liability insurance</text>
  <text class="s" x="616" y="217">$1M to $5M</text>
</svg>
