<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d">
  <title id="t">Payment remedies and their deadlines</title>
  <desc id="d">Send the 20-day preliminary notice within 20 days of first furnishing; a stop payment notice before 30 days after a recorded notice of completion or 90 days after completion; a bond lawsuit within 6 months after the stop payment notice period.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="250" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Payment remedies and their deadlines</text>
    <path d="M40 96 H760" stroke="#D5D9DE" stroke-width="4"/>
  <circle cx="100" cy="96" r="9" fill="#0070D5"/>
  <text class="l" x="100" y="130" text-anchor="middle">First furnishing</text>
  <text class="s" x="100" y="150" text-anchor="middle">you start work or</text>
  <text class="s" x="100" y="165" text-anchor="middle">deliver</text>
  <circle cx="250" cy="96" r="9" fill="#0070D5"/>
  <text class="l" x="250" y="130" text-anchor="middle">20-day notice</text>
  <text class="s" x="250" y="150" text-anchor="middle">within 20 days;</text>
  <text class="s" x="250" y="165" text-anchor="middle">protects work from</text>
  <text class="s" x="250" y="180" text-anchor="middle">20 days before</text>
  <circle cx="400" cy="96" r="9" fill="#0070D5"/>
  <text class="l" x="400" y="130" text-anchor="middle">Completion</text>
  <text class="s" x="400" y="150" text-anchor="middle">notice of completion</text>
  <text class="s" x="400" y="165" text-anchor="middle">recorded or not</text>
  <circle cx="550" cy="96" r="9" fill="#C92A06"/>
  <text class="l" x="550" y="130" text-anchor="middle" style="fill:#C92A06">Stop payment</text>
  <text class="l" x="550" y="146" text-anchor="middle" style="fill:#C92A06">notice</text>
  <text class="s" x="550" y="166" text-anchor="middle">30 days after</text>
  <text class="s" x="550" y="181" text-anchor="middle">recorded notice, or</text>
  <text class="s" x="550" y="196" text-anchor="middle">90 days after</text>
  <text class="s" x="550" y="211" text-anchor="middle">completion</text>
  <circle cx="700" cy="96" r="9" fill="#C92A06"/>
  <text class="l" x="700" y="130" text-anchor="middle" style="fill:#C92A06">Bond suit</text>
  <text class="s" x="700" y="150" text-anchor="middle">within 6 months</text>
  <text class="s" x="700" y="165" text-anchor="middle">after that period</text>
  <text class="s" x="32" y="232">Check the current Civil Code (sections 9300 to 9566) for your situation.</text>
</svg>
