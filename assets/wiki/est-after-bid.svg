<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 241.0" role="img" aria-labelledby="t d">
  <title id="t">After the bid opening</title>
  <desc id="d">Read the bid summary, act on post-bid requirements if low, wait for award, and log every result to learn.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="241.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">After the bid opening</text>
    <text class="s" x="32" y="74">Won or lost, every result says something about your prices.</text>
  <rect x="24" y="94" width="174" height="119" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="118" style="fill:#0070D5">Results</text>
  <text class="s" x="38" y="137">Bid summary: totals,</text>
  <text class="s" x="38" y="153">item prices once</text>
  <text class="s" x="38" y="169">verified</text>
  <rect x="216" y="94" width="174" height="119" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="230" y="118" style="fill:#2E7D32">If low</text>
  <text class="s" x="230" y="137">Post-bid forms and</text>
  <text class="s" x="230" y="153">deadlines</text>
  <text class="s" x="230" y="169">Confirm subs and</text>
  <text class="s" x="230" y="185">suppliers</text>
  <rect x="409" y="94" width="174" height="119" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="423" y="118" style="fill:#B26A00">Award</text>
  <text class="s" x="423" y="137">Responsiveness,</text>
  <text class="s" x="423" y="153">protests</text>
  <text class="s" x="423" y="169">Contract, bonds,</text>
  <text class="s" x="423" y="185">insurance</text>
  <rect x="602" y="94" width="174" height="119" rx="12" fill="#F2F3F5" stroke="#595959" stroke-width="1.5"/>
  <text class="l" x="616" y="118">Lessons</text>
  <text class="s" x="616" y="137">Compare item by item</text>
  <text class="s" x="616" y="153">Log every bid</text>
</svg>
