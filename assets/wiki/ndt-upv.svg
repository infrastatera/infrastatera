<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">Ultrasonic pulse velocity arrangements</title>
  <desc id="d">Direct transmission with transducers on opposite faces, semi-direct on adjacent faces, and indirect with both on the same face; velocity equals path length divided by travel time.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="330" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Ultrasonic pulse velocity arrangements</text>
    <rect x="70" y="90" width="170" height="140" fill="#D9D6CF" stroke="#BDB8AE" stroke-width="2"/>
  <text class="l" x="155" y="270" text-anchor="middle">Direct</text>
  <rect x="315" y="90" width="170" height="140" fill="#D9D6CF" stroke="#BDB8AE" stroke-width="2"/>
  <text class="l" x="400" y="270" text-anchor="middle">Semi-direct</text>
  <rect x="560" y="90" width="170" height="140" fill="#D9D6CF" stroke="#BDB8AE" stroke-width="2"/>
  <text class="l" x="645" y="270" text-anchor="middle">Indirect</text>
  <rect x="61" y="151" width="18" height="18" rx="3" fill="#0070D5"/>
  <rect x="231" y="151" width="18" height="18" rx="3" fill="#2E7D32"/>
  <path d="M82 160 H226" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#am)"/>
  <rect x="321" y="91" width="18" height="18" rx="3" fill="#0070D5"/>
  <rect x="436" y="221" width="18" height="18" rx="3" fill="#2E7D32"/>
  <path d="M338 108 L438 220" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#am)"/>
  <rect x="551" y="81" width="18" height="18" rx="3" fill="#0070D5"/>
  <rect x="671" y="81" width="18" height="18" rx="3" fill="#2E7D32"/>
  <path d="M568 98 Q620 150 672 98" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#am)"/>
  <text class="s" x="32" y="300">Blue: transmitter. Green: receiver. Velocity = path length / travel time (ASTM C597).</text>
</svg>
