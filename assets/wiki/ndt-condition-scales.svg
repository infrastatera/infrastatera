<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
  <title id="t">Two rating systems</title>
  <desc id="d">NBI component ratings from 9 excellent to 0 failed, grouped as good 7 to 9, fair 5 to 6 and poor 4 or less; element condition states 1 good, 2 fair, 3 poor, 4 severe, recorded as quantities.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="380" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Two rating systems</text>
    <rect x="40" y="322" width="40" height="24" rx="4" fill="#C92A06"/>
  <text class="n" x="60" y="339" text-anchor="middle">0</text>
  <text class="s" x="92" y="339">Failed</text>
  <rect x="40" y="294" width="40" height="24" rx="4" fill="#C92A06"/>
  <text class="n" x="60" y="311" text-anchor="middle">1</text>
  <text class="s" x="92" y="311">Imminent failure</text>
  <rect x="40" y="266" width="40" height="24" rx="4" fill="#C92A06"/>
  <text class="n" x="60" y="283" text-anchor="middle">2</text>
  <text class="s" x="92" y="283">Critical</text>
  <rect x="40" y="238" width="40" height="24" rx="4" fill="#C92A06"/>
  <text class="n" x="60" y="255" text-anchor="middle">3</text>
  <text class="s" x="92" y="255">Serious</text>
  <rect x="40" y="210" width="40" height="24" rx="4" fill="#C92A06"/>
  <text class="n" x="60" y="227" text-anchor="middle">4</text>
  <text class="s" x="92" y="227">Poor</text>
  <rect x="40" y="182" width="40" height="24" rx="4" fill="#B26A00"/>
  <text class="n" x="60" y="199" text-anchor="middle">5</text>
  <text class="s" x="92" y="199">Fair</text>
  <rect x="40" y="154" width="40" height="24" rx="4" fill="#B26A00"/>
  <text class="n" x="60" y="171" text-anchor="middle">6</text>
  <text class="s" x="92" y="171">Satisfactory</text>
  <rect x="40" y="126" width="40" height="24" rx="4" fill="#2E7D32"/>
  <text class="n" x="60" y="143" text-anchor="middle">7</text>
  <text class="s" x="92" y="143">Good</text>
  <rect x="40" y="98" width="40" height="24" rx="4" fill="#2E7D32"/>
  <text class="n" x="60" y="115" text-anchor="middle">8</text>
  <text class="s" x="92" y="115">Very good</text>
  <rect x="40" y="70" width="40" height="24" rx="4" fill="#2E7D32"/>
  <text class="n" x="60" y="87" text-anchor="middle">9</text>
  <text class="s" x="92" y="87">Excellent</text>
  <text class="l" x="220" y="112" style="fill:#2E7D32">Good (7 to 9)</text>
  <text class="l" x="220" y="186" style="fill:#B26A00">Fair (5 to 6)</text>
  <text class="l" x="220" y="280" style="fill:#C92A06">Poor (4 or less)</text>
  <text class="s" x="40" y="362">NBI components: deck, superstructure, substructure, culvert</text>
  <text class="l" x="420" y="84">Element condition states: a 4,000 sq ft deck</text>
  <rect x="420" y="100" width="272" height="40" fill="#2E7D32"/>
  <rect x="692" y="100" width="42" height="40" fill="#B26A00"/>
  <rect x="734" y="100" width="21" height="40" fill="#C92A06"/>
  <rect x="756" y="100" width="4" height="40" fill="#7A1A05"/>
  <rect x="420" y="170" width="16" height="16" fill="#2E7D32"/>
  <text class="s" x="446" y="183">CS1 Good: 3,200 sq ft</text>
  <rect x="420" y="204" width="16" height="16" fill="#B26A00"/>
  <text class="s" x="446" y="217">CS2 Fair: 500 sq ft</text>
  <rect x="420" y="238" width="16" height="16" fill="#C92A06"/>
  <text class="s" x="446" y="251">CS3 Poor: 250 sq ft</text>
  <rect x="420" y="272" width="16" height="16" fill="#7A1A05"/>
  <text class="s" x="446" y="285">CS4 Severe: 50 sq ft</text>
</svg>
