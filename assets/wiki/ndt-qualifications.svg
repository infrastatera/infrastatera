  <title id="t">Roles and qualifications</title>
  <desc id="d">Bridge inspection team leaders and program managers under the NBIS; NDT technicians at Levels I, II and III by method; welding inspectors; concrete testing and special inspectors; licensed engineers; licensed radiographers.</desc>
