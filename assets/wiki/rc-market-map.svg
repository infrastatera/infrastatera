  <rect width="800" height="201.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Choosing where to compete</text>
    <rect x="24" y="70" width="239" height="103" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="94" style="fill:#0070D5">Public works</text>
  <text class="s" x="38" y="113">Published bids</text>
  <text class="s" x="38" y="129">Lowest responsive bidder</text>
  <text class="s" x="38" y="145">Heavy paperwork, sure payment</text>
  <rect x="281" y="70" width="239" height="103" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="295" y="94" style="fill:#2E7D32">Private work</text>
  <text class="s" x="295" y="113">Relationships</text>
  <text class="s" x="295" y="129">Price and reputation</text>
