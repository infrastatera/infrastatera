<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
  <title id="t">Types of inspection</title>
  <desc id="d">Inspection types arranged by how close the inspector gets and how often: routine visual every 24 months by default; in-depth, NSTM and underwater hands-on at their own intervals; initial, damage and special inspections when needed.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="360" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Types of inspection</text>
    <path d="M70 300 H760" stroke="#262626" stroke-width="1.5" marker-end="url(#am)"/>
  <path d="M70 300 V70" stroke="#262626" stroke-width="1.5" marker-end="url(#am)"/>
  <text class="s" x="760" y="326" text-anchor="end">how close: from a distance to hands-on</text>
  <text class="s" x="40" y="300" transform="rotate(-90 40 300)">how often: on events to scheduled</text>
  <rect x="100" y="80" width="150" height="79" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="114" y="104" style="fill:#0070D5">Routine</text>
  <text class="s" x="114" y="123">every 24 months by</text>
  <text class="s" x="114" y="139">default</text>
  <rect x="270" y="100" width="150" height="79" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="284" y="124" style="fill:#2E7D32">In-depth</text>
  <text class="s" x="284" y="143">close-up, may</text>
  <text class="s" x="284" y="159">include NDT</text>
  <rect x="610" y="80" width="150" height="79" rx="12" fill="#FDEDEA" stroke="#C92A06" stroke-width="1.5"/>
  <text class="l" x="624" y="104" style="fill:#C92A06">NSTM</text>
  <text class="s" x="624" y="123">hands-on, critical</text>
  <text class="s" x="624" y="139">steel</text>
  <rect x="610" y="190" width="150" height="79" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="624" y="214" style="fill:#0070D5">Underwater</text>
  <text class="s" x="624" y="233">divers, own</text>
  <text class="s" x="624" y="249">interval</text>
  <rect x="100" y="190" width="150" height="79" rx="12" fill="#F2F3F5" stroke="#595959" stroke-width="1.5"/>
  <text class="l" x="114" y="214">Initial</text>
  <text class="s" x="114" y="233">baseline at</text>
  <text class="s" x="114" y="249">opening</text>
  <rect x="270" y="200" width="150" height="79" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="284" y="224" style="fill:#B26A00">Special</text>
  <text class="s" x="284" y="243">follows a known</text>
  <text class="s" x="284" y="259">problem</text>
  <rect x="440" y="190" width="150" height="63" rx="12" fill="#FDEDEA" stroke="#C92A06" stroke-width="1.5"/>
  <text class="l" x="454" y="214" style="fill:#C92A06">Damage</text>
  <text class="s" x="454" y="233">after an event</text>
</svg>
