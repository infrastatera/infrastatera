<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d">
  <title id="t">Directional boring in three steps</title>
  <desc id="d">A drill rig bores a pilot hole under a road and around an existing utility, enlarges it with a reamer, then pulls the conduit back through it.</desc>
  <defs>
    <pattern id="soil" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#E3D1AC"/><circle cx="4" cy="5" r="1.1" fill="#C9B587"/><circle cx="11" cy="11" r="0.9" fill="#C9B587"/></pattern>
    <g id="scene">
      <rect x="20" y="0" width="760" height="140" fill="url(#soil)"/>
      <path d="M20 0 H780" stroke="#7A6A4C" stroke-width="2"/>
      <!-- road -->
      <rect x="310" y="-8" width="180" height="10" fill="#4A4D52"/>
      <path d="M330 -3 H350 M380 -3 H400 M430 -3 H450" stroke="#F2F2F2" stroke-width="2"/>
      <rect x="360" y="-30" width="60" height="18" rx="5" fill="#0070D5"/><rect x="372" y="-40" width="34" height="12" rx="4" fill="#0070D5"/>
      <circle cx="372" cy="-10" r="5" fill="#262626"/><circle cx="408" cy="-10" r="5" fill="#262626"/>
      <!-- rig -->
      <rect x="40" y="-22" width="88" height="16" rx="6" fill="#F2B705" stroke="#B98900"/>
      <rect x="46" y="-8" width="76" height="8" rx="4" fill="#3A3D41"/>
      <path d="M60 -22 L118 -48" stroke="#B98900" stroke-width="7" stroke-linecap="round"/>
      <rect x="74" y="-40" width="22" height="16" fill="#3A3D41"/>
      <!-- pits -->
      <path d="M128 0 q8 14 22 0" fill="#C9B587" stroke="#7A6A4C"/>
      <path d="M660 0 q12 18 30 0" fill="#C9B587" stroke="#7A6A4C"/>
      <!-- existing utility (potholed) -->
      <circle cx="400" cy="44" r="13" fill="#9CA3AA" stroke="#5F656C" stroke-width="2"/>
      <path d="M392 0 V28 M408 0 V28" stroke="#7A6A4C" stroke-dasharray="3 3"/>
    </g>
  </defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; }
    .step { font-size: 15px; font-weight: 600; }
    .l { font-size: 13px; }
    .s { font-size: 12px; fill: #595959; }
    .lead { stroke: #8A8E91; stroke-width: 1.2; fill: none; }
  </style>
  <rect width="800" height="640" fill="#FFFFFF"/>
  <text class="h" x="32" y="36">Directional boring in three steps</text>

  <!-- step 1 -->
  <g transform="translate(0 150)">
    <use href="#scene"/>
    <path d="M118 -4 Q400 160 676 0" fill="none" stroke="#5F656C" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M118 -4 Q260 70 340 76" fill="none" stroke="#262626" stroke-width="3"/>
    <path d="M336 70 L352 77 L336 84 Z" fill="#C92A06"/>
    <text class="step" x="32" y="-62">1  Pilot bore</text>
    <text class="l" x="560" y="-62">The head is steered and tracked</text>
    <text class="s" x="560" y="-46">from the surface by a locator</text>
    <path class="lead" d="M414 44 H500"/><text class="l" x="506" y="48">Existing utility, potholed first</text>
  </g>

  <!-- step 2 -->
  <g transform="translate(0 320)">
    <use href="#scene"/>
    <path d="M118 -4 Q400 160 676 0" fill="none" stroke="#8A7A58" stroke-width="12" opacity="0.55"/>
    <path d="M118 -4 Q400 160 676 0" fill="none" stroke="#262626" stroke-width="2.5"/>
    <circle cx="560" cy="62" r="11" fill="#C92A06"/>
    <path d="M553 62 h14 M560 55 v14" stroke="#FFFFFF" stroke-width="2"/>
    <text class="step" x="32" y="-62">2  Ream</text>
    <text class="l" x="560" y="-62">A reamer enlarges the hole;</text>
    <text class="s" x="560" y="-46">drilling fluid keeps it open</text>
  </g>

  <!-- step 3 -->
  <g transform="translate(0 490)">
    <use href="#scene"/>
    <path d="M118 -4 Q400 160 676 0" fill="none" stroke="#8A7A58" stroke-width="12" opacity="0.55"/>
    <path d="M118 -4 Q400 160 676 0" fill="none" stroke="#0070D5" stroke-width="7"/>
    <path d="M676 0 L760 -6" stroke="#0070D5" stroke-width="7" stroke-linecap="round"/>
    <text class="step" x="32" y="-62">3  Pull back the conduit</text>
    <text class="l" x="560" y="-62">Conduit is pulled back to the rig;</text>
    <text class="s" x="560" y="-46">the bore log records the depth</text>
  </g>

  <text class="s" x="32" y="626">Illustration only, not to scale. Clearances from utilities and depths follow your contract and the utility owners.</text>
</svg>
