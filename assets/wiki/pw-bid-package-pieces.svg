<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 314.0" role="img" aria-labelledby="t d">
  <title id="t">What goes with a public bid</title>
  <desc id="d">Documents due with the bid: bid form, bid security, subcontractor list, addenda acknowledgement, non-collusion declaration, license and DIR numbers. Due after opening on many jobs: DBE and federal forms, experience statements.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="314.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">What goes with a public bid</text>
    <text class="s" x="32" y="74">Blue: in the envelope. Amber: due within the days the special provisions set.</text>
  <rect x="24" y="94" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="118" style="fill:#0070D5">Bid form</text>
  <text class="s" x="38" y="137">Unit prices or lump sum</text>
  <text class="s" x="38" y="153">Signed, totals checked</text>
  <rect x="281" y="94" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="295" y="118" style="fill:#0070D5">Bid security</text>
  <text class="s" x="295" y="137">10% of the bid, usually</text>
  <text class="s" x="295" y="153">With power of attorney</text>
  <rect x="537" y="94" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="551" y="118" style="fill:#0070D5">Subcontractor list</text>
  <text class="s" x="551" y="137">Above one-half of 1%</text>
  <text class="s" x="551" y="153">License and DIR numbers</text>
  <rect x="24" y="199" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="223" style="fill:#0070D5">Addenda</text>
  <text class="s" x="38" y="242">Every one acknowledged</text>
  <rect x="281" y="199" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="295" y="223" style="fill:#0070D5">Declarations</text>
  <text class="s" x="295" y="242">Non-collusion and others the</text>
  <text class="s" x="295" y="258">agency lists</text>
  <rect x="537" y="199" width="239" height="87" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="551" y="223" style="fill:#B26A00">After opening</text>
  <text class="s" x="551" y="242">DBE and federal-aid forms</text>
  <text class="s" x="551" y="258">Experience, if requested</text>
</svg>
