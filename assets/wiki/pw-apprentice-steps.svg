<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="t d">
  <title id="t">Apprentices on a public works job</title>
  <desc id="d">For contracts of $30,000 or more: send DAS 140 within 10 days of signing, request apprentices with DAS 142 at least three business days ahead, employ one apprentice hour per five journeyperson hours, and pay training fund contributions.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="230" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">Apprentices on a public works job</text>
    <rect x="24" y="70" width="167" height="112" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="38" y="94">Notify: DAS 140</text>
  <text class="s" x="38" y="113">to programs in the</text>
  <text class="s" x="38" y="129">area, within 10 days</text>
  <text class="s" x="38" y="145">of signing, before</text>
  <text class="s" x="38" y="161">work</text>
  <circle cx="175" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="175" y="90" text-anchor="middle">1</text>
  <path d="M193 126 H215" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="219" y="70" width="167" height="112" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="233" y="94">Request: DAS</text>
  <text class="l" x="233" y="111">142</text>
  <text class="s" x="233" y="130">at least 3 business</text>
  <text class="s" x="233" y="146">days before needed</text>
  <circle cx="370" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="370" y="90" text-anchor="middle">2</text>
  <path d="M388 126 H410" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="414" y="70" width="167" height="112" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="428" y="94">Employ in ratio</text>
  <text class="s" x="428" y="113">1 apprentice hour</text>
  <text class="s" x="428" y="129">per 5 journeyperson</text>
  <text class="s" x="428" y="145">hours, per craft</text>
  <circle cx="565" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="565" y="90" text-anchor="middle">3</text>
  <path d="M583 126 H605" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="609" y="70" width="167" height="112" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="623" y="94">Contribute</text>
  <text class="s" x="623" y="113">training fund per</text>
  <text class="s" x="623" y="129">hour, per craft</text>
  <circle cx="760" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="760" y="90" text-anchor="middle">4</text>
</svg>
