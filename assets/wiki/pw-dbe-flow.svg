  <path d="M622 158 H644" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="648" y="70" width="128" height="177" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="662" y="94">Pay and</text>
  <text class="l" x="662" y="111">report</text>
  <text class="s" x="662" y="130">prompt</text>
  <text class="s" x="662" y="146">payment,</text>
  <text class="s" x="662" y="162">monthly</text>
  <text class="s" x="662" y="178">certification</text>
  <circle cx="760" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="760" y="90" text-anchor="middle">5</text>
</svg>
