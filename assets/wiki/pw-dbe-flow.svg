<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 295" role="img" aria-labelledby="t d">
  <title id="t">DBE rules on a federal-aid job</title>
  <desc id="d">Read the special provisions for any DBE goal and forms; submit what is required with or after the bid; perform with DBEs doing a commercially useful function; get consent before replacing a DBE; pay promptly and report monthly.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="295" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">DBE rules on a federal-aid job</text>
    <rect x="24" y="70" width="128" height="177" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="38" y="94">Read the</text>
  <text class="l" x="38" y="111">job's</text>
  <text class="l" x="38" y="128">rules</text>
  <text class="s" x="38" y="147">goal or no</text>
  <text class="s" x="38" y="163">goal, forms,</text>
  <text class="s" x="38" y="179">deadlines</text>
  <text class="s" x="38" y="195">(goals</text>
  <text class="s" x="38" y="211">suspended in</text>
  <text class="s" x="38" y="227">2026)</text>
  <circle cx="136" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="136" y="90" text-anchor="middle">1</text>
  <path d="M154 158 H176" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="180" y="70" width="128" height="177" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="194" y="94">Bid</text>
  <text class="s" x="194" y="113">commitments or</text>
  <text class="s" x="194" y="129">good faith</text>
  <text class="s" x="194" y="145">efforts if</text>
  <text class="s" x="194" y="161">required</text>
  <circle cx="292" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="292" y="90" text-anchor="middle">2</text>
  <path d="M310 158 H332" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="336" y="70" width="128" height="177" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="350" y="94">Perform</text>
  <text class="s" x="350" y="113">DBEs do a</text>
  <text class="s" x="350" y="129">commercially</text>
  <text class="s" x="350" y="145">useful</text>
  <text class="s" x="350" y="161">function</text>
  <circle cx="448" cy="86" r="10" fill="#0070D5"/>
  <text class="n" x="448" y="90" text-anchor="middle">3</text>
  <path d="M466 158 H488" fill="none" stroke="#0070D5" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="492" y="70" width="128" height="177" rx="12" fill="#F7F9FA" stroke="#D5D9DE" stroke-width="1.5"/>
  <text class="l" x="506" y="94">Changes</text>
  <text class="s" x="506" y="113">written</text>
  <text class="s" x="506" y="129">consent before</text>
  <text class="s" x="506" y="145">replacing a</text>
  <text class="s" x="506" y="161">DBE</text>
  <circle cx="604" cy="86" r="10" fill="#0070D5"/>
