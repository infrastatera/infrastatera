<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 314.0" role="img" aria-labelledby="t d">
  <title id="t">License classes on public works</title>
  <desc id="d">CSLB license classes commonly required on public works: A general engineering, B general building, C-10 electrical, C-7 low voltage, C-12 earthwork and paving, C-32 parking and highway improvement.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="314.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">License classes on public works</text>
    <text class="s" x="32" y="74">The bid documents name the acceptable classes. The license must be active when the bid is submitted.</text>
  <rect x="24" y="94" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="118" style="fill:#0070D5">A General Engineering</text>
  <text class="s" x="38" y="137">Highways, bridges, utilities,</text>
  <text class="s" x="38" y="153">pipelines, earthwork</text>
  <rect x="281" y="94" width="239" height="87" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="295" y="118" style="fill:#0070D5">B General Building</text>
  <text class="s" x="295" y="137">Buildings with two or more</text>
  <text class="s" x="295" y="153">unrelated trades</text>
  <rect x="537" y="94" width="239" height="87" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="551" y="118" style="fill:#2E7D32">C-10 Electrical</text>
  <text class="s" x="551" y="137">Lighting, signals, services,</text>
  <text class="s" x="551" y="153">wiring</text>
  <rect x="24" y="199" width="239" height="87" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="38" y="223" style="fill:#2E7D32">C-7 Low Voltage</text>
  <text class="s" x="38" y="242">Communications and low-voltage</text>
  <text class="s" x="38" y="258">systems</text>
  <rect x="281" y="199" width="239" height="87" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="295" y="223" style="fill:#2E7D32">C-12 Earthwork and Paving</text>
  <text class="s" x="295" y="242">Grading and paving</text>
  <rect x="537" y="199" width="239" height="87" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="551" y="223" style="fill:#2E7D32">C-32 Parking and Highway</text>
  <text class="s" x="551" y="242">Striping, signs, barriers</text>
</svg>
