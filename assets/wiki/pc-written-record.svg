<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 233.0" role="img" aria-labelledby="t d">
  <title id="t">The written record of a job</title>
  <desc id="d">Meetings with action items, correspondence and notices, the schedule and its submitted versions, and important emails filed in the project.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#0070D5"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#C92A06"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2E7D32"/></marker><marker id="am" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#595959"/></marker><marker id="aa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B26A00"/></marker></defs>
  <style>
    text { font-family: "Open Sans", Helvetica, Arial, sans-serif; fill: #262626; }
    .h { font-size: 20px; font-weight: 600; } .l { font-size: 13px; font-weight: 600; } .s { font-size: 12px; fill: #595959; } .n { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>
  <rect width="800" height="233.0" fill="#FFFFFF"/>
  <text class="h" x="32" y="40">The written record of a job</text>
    <rect x="24" y="70" width="174" height="135" rx="12" fill="#EAF3FC" stroke="#0070D5" stroke-width="1.5"/>
  <text class="l" x="38" y="94" style="fill:#0070D5">Meetings</text>
  <text class="s" x="38" y="113">Preconstruction,</text>
  <text class="s" x="38" y="129">weekly, safety</text>
  <text class="s" x="38" y="145">Action items with</text>
  <text class="s" x="38" y="161">owners</text>
  <rect x="216" y="70" width="174" height="135" rx="12" fill="#FDEDEA" stroke="#C92A06" stroke-width="1.5"/>
  <text class="l" x="230" y="94" style="fill:#C92A06">Correspondence</text>
  <text class="s" x="230" y="113">Letters to and from</text>
  <text class="s" x="230" y="129">the RE</text>
  <text class="s" x="230" y="145">Notices: extra work,</text>
  <text class="s" x="230" y="161">delay, site</text>
  <text class="s" x="230" y="177">conditions</text>
  <rect x="409" y="70" width="174" height="135" rx="12" fill="#EAF5EB" stroke="#2E7D32" stroke-width="1.5"/>
  <text class="l" x="423" y="94" style="fill:#2E7D32">Schedule</text>
  <text class="s" x="423" y="113">Baseline and every</text>
  <text class="s" x="423" y="129">update</text>
  <text class="s" x="423" y="145">Each submitted</text>
  <text class="s" x="423" y="161">version kept</text>
  <rect x="602" y="70" width="174" height="135" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/>
  <text class="l" x="616" y="94" style="fill:#B26A00">Email</text>
  <text class="s" x="616" y="113">Forward important</text>
  <text class="s" x="616" y="129">answers</text>
  <text class="s" x="616" y="145">Into the project, not</text>
  <text class="s" x="616" y="161">an inbox</text>
</svg>
