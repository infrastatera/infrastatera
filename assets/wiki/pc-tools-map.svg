  <title id="t">One project, three groups of tools</title>
  <desc id="d">Field tools (daily log, photos, timesheets, inspections, punch list), document and office tools (drawings, specifications, RFIs, submittals, meetings) and financial tools (budget, commitments, change events, invoicing) on one shared project.</desc>
